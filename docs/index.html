<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bentas Design System</title>
  <!-- Geist font (async) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <!-- Header / Logo -->
    <div class="sidebar-header" onclick="navigate('welcome')">
      <div class="logo-icon">
        <div class="logo-circle logo-circle-1"></div>
        <div class="logo-circle logo-circle-2"></div>
        <div class="logo-circle logo-circle-3"></div>
      </div>
      <div class="logo-text">BENTAS DESIGN SYSTEM</div>
    </div>

    <!-- Platform Switcher -->
    <div id="platform-switcher"></div>

    <!-- Navigation -->
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- rendered by JS -->
    </nav>

  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Main Header (full width) -->
    <header class="main-header">
      <div class="main-header-left">
        <span class="header-title" id="platform-header-title">Web</span>
        <span class="version-badge">v1.0.0</span>
      </div>
      <div class="main-header-actions">
        <button class="header-btn" title="GitHub">
          <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844a9.59 9.59 0 012.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Body: content column + TOC column -->
    <div class="main-body">

      <!-- Center column: tabs + scrollable content -->
      <div class="content-col">
        <div class="tabs-bar" id="tabs-bar" style="display:none"></div>
        <div class="content-wrap">
          <div class="content">
            <h1 class="page-title" id="page-title" style="display:none"></h1>
            <div id="content-body"></div>
          </div>
        </div>
      </div>

      <!-- Right column: TOC panel -->
      <aside class="toc-col" id="toc-col" style="display:none">
        <div id="toc"></div>
      </aside>

    </div>

  </div>

</div>

<script src="js/pages-mobile.js"></script>
<script src="js/pages-web.js"></script>
<script src="js/app.js"></script>
</body>
</html>

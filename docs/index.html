<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Design System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-inner" id="sidebar-nav">
      <!-- rendered by JS -->
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Tabs bar (sticky) -->
    <div class="tabs-bar" id="tabs-bar" style="display:none"></div>

    <!-- Content + TOC -->
    <div class="content-wrap">

      <div class="content">
        <h1 class="page-title" id="page-title" style="display:none"></h1>
        <div id="content-body"></div>
      </div>

      <div class="toc" id="toc" style="display:none"></div>

    </div>

  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>

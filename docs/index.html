<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Design System</title>
  <!-- Inter font (loaded async so page doesn't block) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo" onclick="navigate('welcome')" style="cursor:pointer">
      <div class="sidebar-logo-icon">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 5a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm0 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10-10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zm0 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
        </svg>
      </div>
      <div class="sidebar-logo-text">
        <div class="sidebar-logo-name">Design System</div>
        <div class="sidebar-logo-sub">Mobile</div>
      </div>
    </div>

    <!-- Search -->
    <div class="sidebar-search">
      <div class="search-box">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
        </svg>
        <span>Search...</span>
        <kbd class="search-kbd">⌘K</kbd>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- rendered by JS -->
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <span class="sidebar-version">v1.0.0</span>
    </div>

  </aside>

  <!-- ── Main ── -->
  <div class="main">

    <!-- Header -->
    <header class="header">

      <div class="header-top">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="breadcrumb"></nav>

        <!-- Actions -->
        <div class="header-actions">
          <button class="header-btn" title="GitHub">
            <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844a9.59 9.59 0 012.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Title row (hidden on welcome) -->
      <div class="header-title-row" id="header-title-row" style="display:none">
        <div class="header-left">
          <h1 class="page-title" id="page-title"></h1>
        </div>
      </div>

      <!-- Tabs -->
      <div class="page-tabs" id="page-tabs"></div>

    </header>

    <!-- Content -->
    <main class="content" id="content">
      <!-- rendered by JS -->
    </main>

  </div><!-- /main -->

</div><!-- /app -->

<script src="js/app.js"></script>
</body>
</html>

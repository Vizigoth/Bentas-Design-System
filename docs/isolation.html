<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bentas Design System — Isolation Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    html, body { height: 100%; margin: 0; background: var(--bt-surface-subtle); }
    .iso-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 40px;
      box-sizing: border-box;
    }
    .iso-badge {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(26,26,26,.85);
      color: #fff;
      font-family: var(--font);
      font-size: 12px;
      letter-spacing: .02em;
      z-index: 10;
    }
    .iso-empty {
      font-family: var(--font);
      color: var(--bt-text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="iso-badge">Isolation Mode</div>
  <div class="iso-shell" id="iso-root"></div>

  <script src="js/playground.js"></script>
  <script src="js/pages-mobile.js"></script>
  <script src="js/pages-web.js"></script>
  <script>
    const params    = new URLSearchParams(location.search);
    const component = params.get('component');
    const pgdId     = params.get('pgd_id');
    const variant   = params.get('variant') || 'default';
    const props     = {};
    for (const [k, v] of params.entries()) {
      if (k !== 'component' && k !== 'variant' && k !== 'pgd_id') props[k] = v;
    }
    const root  = document.getElementById('iso-root');
    const entry = window.PGD_ISOLATE && window.PGD_ISOLATE[component];

    if (entry) {
      // Registered isolation target (e.g. Sidebar, Alert)
      entry.mount(root, variant, props);
      document.title = `${component} (${variant}) — Isolation Mode · Bentas Design System`;

    } else if (pgdId) {
      // Auto-isolation: call render() on each page/tab until the target playground
      // id appears in _pgdConfigs, then stop — no need to iterate the whole tree.
      const allTabs = ['Overview', 'Examples', 'CSS Properties', 'Usage'];
      outer: for (const page of Object.values(window.PAGES_WEB || {})) {
        for (const tab of allTabs) {
          try { page.render(tab); } catch (e) {}
          if (window._pgdConfigs[pgdId]) break outer;
        }
      }
      const cfg = window._pgdConfigs && window._pgdConfigs[pgdId];
      if (cfg) {
        const resolvedProps = {};
        (cfg.props || []).forEach(p => {
          resolvedProps[p.key] = props[p.key] || p.default || (p.options && p.options[0].key);
        });
        const resolvedVariant = (cfg.variants || []).find(v => v.key === variant)
          ? variant
          : (cfg.variants ? cfg.variants[0].key : variant);
        root.innerHTML = cfg.preview(resolvedVariant, resolvedProps);
        document.title = 'Isolation Mode · Bentas Design System';
      } else {
        root.innerHTML = '<p class="iso-empty">Component not found.</p>';
      }

    } else {
      root.innerHTML = '<p class="iso-empty">Unknown component — open this page via a component\'s "Open in isolation mode" button.</p>';
    }
  </script>
</body>
</html>
